name: OmniMind AI OS CI

on:
  push:
    branches: [ main, fix/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate syntax and compilation
        run: |
          python -m compileall backend frontend run.py verify_services.py

      - name: Run automated test suite
        run: |
          pytest -v tests/

      - name: Run service verification
        run: |
          python verify_services.py
